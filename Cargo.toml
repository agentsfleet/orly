[package]
name = "orly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[workspace]
members = ["crates/fs", "crates/decision", "tools/xtask"]
resolver = "3"

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anstyle = "1.0.14"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
cap-tempfile = "4.0.3"
clap = { version = "4.6.7" }
constcat = "0.6.1"
digest-io = "0.1.0"
git2 = { version = "0.21.0", default-features = false }
globset = "0.4.20"
hex = "0.4.3"
jsonschema = { version = "0.58.4", default-features = false }
nix = { version = "0.31.3" }
orly = { path = ".", version = "0.12.0", default-features = false }
orly-decision = { path = "crates/decision", version = "0.12.0", default-features = false }
orly-fs = { path = "crates/fs", version = "0.12.0", default-features = false }
petgraph = { version = "0.8.3", default-features = false }
pulldown-cmark = "0.13.4"
pulldown-cmark-escape = "0.11.0"
pulldown-cmark-to-cmark = "22.0.3"
relative-path = "2.0.1"
reqwest = { version = "0.13.5", default-features = false }
same-file = "1.0.6"
schemars = "1.2.2"
semver = "1.0.28"
serde = { version = "1.0.229" }
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "2.0.1"
syn = { version = "2.0.117" }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
tokio = { version = "1.53.1", default-features = false }
subc-jobobject = "0.1.1"
tracing = "0.1.44"
tracing-logfmt = { version = "0.3.7", default-features = false }
tracing-subscriber = { version = "0.3.23" }
tree-sitter = "0.26.3"
tree-sitter-bash = "0.25.1"
tree-sitter-md = { version = "0.5.3" }
url = "2.5.8"

[dependencies]
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
thiserror = { workspace = true }
pulldown-cmark = { workspace = true }
globset = { workspace = true }
semver = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "process", "io-util", "time"] }
toml = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["rustls", "json"], optional = true }
tracing = { workspace = true }
tracing-logfmt = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anstyle = { workspace = true }
shlex = { workspace = true }
petgraph = { workspace = true, default-features = false, features = ["std"] }
git2 = { workspace = true, default-features = false }
tree-sitter-md = { workspace = true, features = ["parser"] }
tree-sitter-bash = { workspace = true }
tree-sitter = { workspace = true }
pulldown-cmark-to-cmark = { workspace = true }
url = { workspace = true }
relative-path = { workspace = true }
pulldown-cmark-escape = { workspace = true }
constcat = { workspace = true }
orly-fs.workspace = true
orly-decision.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process", "fs"] }

[target.'cfg(windows)'.dependencies]
subc-jobobject.workspace = true

[features]
default = []
judge-transport = ["dep:reqwest"]
test-util = []

[build-dependencies]
pulldown-cmark = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = true

[profile.test]
opt-level = 1

[lints]
workspace = true
