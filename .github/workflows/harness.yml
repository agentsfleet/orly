name: Harness

# Merges to main run the audit too. `release.yml` also runs `make audit`, but
# only behind `already == 'false'` — a merge that carries no version bump
# publishes nothing and so audits nothing. This job is what makes the gate
# unconditional on the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install orly dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: make audit
        run: make audit
